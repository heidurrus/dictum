<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dictum icon candidates</title>
<style>
  body { margin: 0; background: #ECEAF2; font: 500 14px/1.4 -apple-system, Inter, sans-serif; color: #45464F; }
  .row { display: flex; gap: 40px; padding: 40px; flex-wrap: wrap; }
  .cand { display: grid; gap: 14px; justify-items: center; }
  .cand svg { width: 256px; height: 256px; filter: drop-shadow(0 12px 28px rgba(27,27,33,.22)); }
  .small { display: flex; gap: 14px; align-items: end; }
  .small svg { width: 64px; height: 64px; filter: drop-shadow(0 3px 8px rgba(27,27,33,.2)); }
  .small svg.s32 { width: 32px; height: 32px; }
  .small svg.s16 { width: 16px; height: 16px; }
  .dock { background: rgba(255,255,255,.55); border-radius: 24px; padding: 14px 18px; display: flex; gap: 16px; align-items: center; }
  .dock svg { width: 72px; height: 72px; }
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- macOS squircle, 1024 grid -->
    <path id="squircle" d="M0 512C0 116 116 0 512 0s512 116 512 512-116 512-512 512S0 908 0 512Z"/>
    <clipPath id="clip"><use href="#squircle"/></clipPath>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F7FEA"/><stop offset=".55" stop-color="#0B57D0"/><stop offset="1" stop-color="#083C8F"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26262E"/><stop offset="1" stop-color="#121216"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9ECF6"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="860"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9E6FF"/></linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="250" y1="600" x2="780" y2="860"><stop offset="0" stop-color="#8AB4FF"/><stop offset="1" stop-color="#2F7FEA"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="-14" stdDeviation="10" flood-color="#083C8F" flood-opacity=".35"/></filter>
  </defs>
</svg>

<div class="row">

  <!-- A. Spoken quote: quotation marks whose right half is a sound wave -->
  <div class="cand">
    <svg id="A" viewBox="0 0 1024 1024">
      <use href="#squircle" fill="url(#blue)"/>
      <use href="#squircle" fill="url(#sheen)"/>
      <g clip-path="url(#clip)">
        <circle cx="512" cy="1100" r="520" fill="#fff" opacity=".07" filter="url(#soft)"/>
        <!-- opening quote: two solid teardrops -->
        <g fill="url(#glyph)">
          <path d="M250 390c0-78 60-140 140-140v62c-46 0-78 30-78 78h78v150H250V390Z"/>
          <path d="M470 390c0-78 60-140 140-140v62c-46 0-78 30-78 78h78v150H470V390Z"/>
        </g>
        <!-- what was said: a wave below -->
        <g stroke="url(#accent)" stroke-width="54" stroke-linecap="round" opacity=".95">
          <line x1="296" y1="700" x2="296" y2="760"/>
          <line x1="404" y1="650" x2="404" y2="810"/>
          <line x1="512" y1="690" x2="512" y2="770"/>
          <line x1="620" y1="620" x2="620" y2="840"/>
          <line x1="728" y1="680" x2="728" y2="780"/>
        </g>
      </g>
    </svg>
    <div>A · Quote + wave</div>
  </div>

  <!-- B. The D is a speech bubble -->
  <div class="cand">
    <svg id="B" viewBox="0 0 1024 1024">
      <use href="#squircle" fill="url(#blue)"/>
      <use href="#squircle" fill="url(#sheen)"/>
      <g clip-path="url(#clip)">
        <circle cx="512" cy="1100" r="520" fill="#fff" opacity=".07" filter="url(#soft)"/>
        <!-- D bubble with a tail at the bottom left -->
        <path fill="url(#glyph)" d="M300 230h190c182 0 312 118 312 282S672 794 490 794H356l-56 80v-80h0V230Zm120 112v340h70c112 0 194-72 194-170s-82-170-194-170h-70Z"/>
        <!-- the said part: a quote mark living inside the D -->
        <path fill="#fff" d="M470 452c0-44 34-80 80-80v36c-26 0-44 18-44 44h44v84h-80v-84Z"/><path fill="#fff" d="M580 452c0-44 34-80 80-80v36c-26 0-44 18-44 44h44v84h-80v-84Z" opacity=".55"/>
      </g>
    </svg>
    <div>B · D as a speech bubble</div>
  </div>

  <!-- C. Said to set: wave becomes requirement lines with a check -->
  <div class="cand">
    <svg id="C" viewBox="0 0 1024 1024">
      <use href="#squircle" fill="url(#blue)"/>
      <use href="#squircle" fill="url(#sheen)"/>
      <g clip-path="url(#clip)">
        <circle cx="512" cy="1100" r="520" fill="#fff" opacity=".07" filter="url(#soft)"/>
        <g stroke="url(#glyph)" stroke-width="58" stroke-linecap="round" fill="none">
          <!-- wave -->
          <line x1="214" y1="470" x2="214" y2="554"/>
          <line x1="318" y1="400" x2="318" y2="624"/>
          <line x1="422" y1="330" x2="422" y2="694"/>
          <!-- becomes lines -->
          <line x1="540" y1="380" x2="810" y2="380"/>
          <line x1="540" y1="512" x2="760" y2="512"/>
          <line x1="540" y1="644" x2="700" y2="644"/>
        </g>
        <!-- check: accepted -->
        <path d="M722 700l40 40 86-90" stroke="#8AB4FF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </svg>
    <div>C · Wave becomes requirements</div>
  </div>

  <!-- D. One big quote mark, its tail is a check -->
  <div class="cand">
    <svg id="D" viewBox="0 0 1024 1024">
      <use href="#squircle" fill="url(#ink)"/>
      <use href="#squircle" fill="url(#sheen)"/>
      <g clip-path="url(#clip)">
        <circle cx="512" cy="560" r="300" fill="#0B57D0" opacity=".55" filter="url(#soft)"/>
        <!-- closing quote drawn large -->
        <g fill="url(#glyph)">
          <path d="M318 650c0-130 95-230 230-230v-100c-200 0-350 150-350 330v10h120Zm0 0h120v160H318V650Z" opacity="0"/>
          <path d="M236 560c0-120 86-224 240-224v96c-80 0-134 44-134 128h134v232H236V560Z"/>
          <path d="M546 560c0-120 86-224 240-224v96c-80 0-134 44-134 128h134v232H546V560Z"/>
        </g>
        <!-- accent check in the second mark -->
        <path d="M612 650l38 38 84-88" stroke="#0B57D0" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </svg>
    <div>D · Dark: quotes with a check</div>
  </div>

  <!-- E. Paper + quote: a page with the spoken mark (light icon, like Notes/Pages) -->
  <div class="cand">
    <svg id="E" viewBox="0 0 1024 1024">
      <use href="#squircle" fill="url(#paper)"/>
      <g clip-path="url(#clip)">
        <rect x="0" y="0" width="1024" height="330" fill="url(#blue)"/>
        <rect x="0" y="0" width="1024" height="330" fill="url(#sheen)"/>
        <!-- quote in the band -->
        <g fill="#fff">
          <path d="M350 118c0-46 36-84 90-84v34c-28 0-48 18-48 50h48v86H350v-86Z"/>
          <path d="M534 118c0-46 36-84 90-84v34c-28 0-48 18-48 50h48v86H534v-86Z"/>
        </g>
        <!-- requirement lines on paper -->
        <g stroke="#0B57D0" stroke-width="44" stroke-linecap="round" opacity=".92">
          <line x1="190" y1="470" x2="640" y2="470"/>
          <line x1="190" y1="600" x2="760" y2="600"/>
          <line x1="190" y1="730" x2="520" y2="730"/>
        </g>
        <g stroke="#0B57D0" stroke-width="44" stroke-linecap="round" opacity=".35">
          <line x1="190" y1="860" x2="420" y2="860"/>
        </g>
        <path d="M690 740l44 44 96-100" stroke="#1E8E3E" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </svg>
    <div>E · Paper with a blue band</div>
  </div>

</div>

<div class="row">
  <div class="dock">
    <svg viewBox="0 0 1024 1024"><use href="#A"/></svg>
    <svg viewBox="0 0 1024 1024"><use href="#B"/></svg>
    <svg viewBox="0 0 1024 1024"><use href="#C"/></svg>
    <svg viewBox="0 0 1024 1024"><use href="#D"/></svg>
    <svg viewBox="0 0 1024 1024"><use href="#E"/></svg>
    <span style="margin-left:8px">in a Dock (72 px)</span>
  </div>
  <div class="small">
    <svg viewBox="0 0 1024 1024"><use href="#A"/></svg><svg class="s32" viewBox="0 0 1024 1024"><use href="#A"/></svg><svg class="s16" viewBox="0 0 1024 1024"><use href="#A"/></svg>
    <span style="width:20px"></span>
    <svg viewBox="0 0 1024 1024"><use href="#B"/></svg><svg class="s32" viewBox="0 0 1024 1024"><use href="#B"/></svg><svg class="s16" viewBox="0 0 1024 1024"><use href="#B"/></svg>
    <span style="width:20px"></span>
    <svg viewBox="0 0 1024 1024"><use href="#C"/></svg><svg class="s32" viewBox="0 0 1024 1024"><use href="#C"/></svg><svg class="s16" viewBox="0 0 1024 1024"><use href="#C"/></svg>
    <span style="width:20px"></span>
    <svg viewBox="0 0 1024 1024"><use href="#D"/></svg><svg class="s32" viewBox="0 0 1024 1024"><use href="#D"/></svg><svg class="s16" viewBox="0 0 1024 1024"><use href="#D"/></svg>
    <span style="width:20px"></span>
    <svg viewBox="0 0 1024 1024"><use href="#E"/></svg><svg class="s32" viewBox="0 0 1024 1024"><use href="#E"/></svg><svg class="s16" viewBox="0 0 1024 1024"><use href="#E"/></svg>
    <span>64 / 32 / 16 px</span>
  </div>
</div>
</body></html>
