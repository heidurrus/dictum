<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Dictum app icon. Three bars of sound become three lines of text.
       Same stroke (60), same pitch (96); sound lengths 176 / 320 / 248, text lines all 320. -->
  <defs>
    <path id="sq" d="M0 512C0 116 116 0 512 0s512 116 512 512-116 512-512 512S0 908 0 512Z"/>
    <clipPath id="clip"><use href="#sq"/></clipPath>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B8BF0"/><stop offset=".55" stop-color="#0B57D0"/><stop offset="1" stop-color="#073A8C"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".20"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <use href="#sq" fill="url(#blue)"/>
  <use href="#sq" fill="url(#sheen)"/>
  <g clip-path="url(#clip)"><circle cx="512" cy="1080" r="520" fill="#fff" opacity=".08" filter="url(#soft)"/></g>
  <g stroke="#fff" stroke-width="60" stroke-linecap="round" fill="none">
    <line x1="208" y1="424" x2="208" y2="600"/>
    <line x1="304" y1="352" x2="304" y2="672"/>
    <line x1="400" y1="388" x2="400" y2="636"/>
    <line x1="496" y1="416" x2="816" y2="416"/>
    <line x1="496" y1="512" x2="816" y2="512"/>
    <line x1="496" y1="608" x2="816" y2="608"/>
  </g>
</svg>
