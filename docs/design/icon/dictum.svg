<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Dictum app icon. Three bars of sound become the same three bars as text:
       same stroke (60), same pitch (96), same lengths (176 / 320 / 248). -->
  <defs>
    <path id="sq" d="M0 512C0 116 116 0 512 0s512 116 512 512-116 512-512 512S0 908 0 512Z"/>
    <clipPath id="clip"><use href="#sq"/></clipPath>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2B33"/><stop offset="1" stop-color="#121216"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".20"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="740"><stop offset="0" stop-color="#8FC0FF"/><stop offset="1" stop-color="#3B8BF0"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <use href="#sq" fill="url(#ink)"/>
  <use href="#sq" fill="url(#sheen)"/>
  <g clip-path="url(#clip)"><circle cx="330" cy="540" r="260" fill="#0B57D0" opacity=".45" filter="url(#soft)"/></g>
  <g stroke="url(#sky)" stroke-width="60" stroke-linecap="round" fill="none">
    <line x1="224" y1="424" x2="224" y2="600"/>
    <line x1="320" y1="352" x2="320" y2="672"/>
    <line x1="416" y1="388" x2="416" y2="636"/>
  </g>
  <g stroke="#F2F1F7" stroke-width="60" stroke-linecap="round" fill="none">
    <line x1="512" y1="416" x2="688" y2="416"/>
    <line x1="512" y1="512" x2="832" y2="512"/>
    <line x1="512" y1="608" x2="760" y2="608"/>
  </g>
</svg>
