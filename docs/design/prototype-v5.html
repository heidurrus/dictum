<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench 5 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (Material-style, tonal) ---------- */
:root {
  color-scheme: light;
  --bg: #F3F2F8; --surface: #FFFFFF; --surface-2: #ECEAF2; --surface-3: #E2E0EA; --surface-4: #D8D6E0;
  --text: #1B1B21; --text-2: #45464F; --text-3: #75767F;
  --primary: #0B57D0; --on-primary: #FFFFFF; --primary-c: #D3E3FD; --on-primary-c: #041E49;
  --secondary-c: #DEE3F5; --on-secondary-c: #171B2C;
  --outline: #C4C6D0; --outline-2: #E1E2EC;
  --ok: #1E8E3E; --ok-c: #DCF3E2; --warn: #9A5A00; --warn-c: #FFEBCC; --danger: #B3261E; --danger-c: #F9DEDC; --rec: #D93025;
  --mark: #FFF1B8; --mic: #0B57D0; --sys: #1E8E3E;
  --hud: #1F1F24; --hud-2: #2B2B31; --hud-text: #F2F1F7; --hud-text-2: #B6B5BF;
  --shadow-1: 0 1px 2px rgba(27,27,33,.06), 0 1px 1px rgba(27,27,33,.03);
  --shadow-2: 0 2px 6px rgba(27,27,33,.08), 0 8px 24px rgba(27,27,33,.08);
  --shadow-3: 0 8px 28px rgba(27,27,33,.16), 0 24px 64px rgba(27,27,33,.18);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-s: 10px; --r-m: 16px; --r-l: 24px; --r-xl: 28px;
  --rail: 88px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #121216; --surface: #1C1C21; --surface-2: #26262C; --surface-3: #30303A; --surface-4: #3B3B46;
  --text: #E5E2EC; --text-2: #C5C4CF; --text-3: #8F8F9A;
  --primary: #A8C7FA; --on-primary: #062E6F; --primary-c: #0842A0; --on-primary-c: #D3E3FD;
  --secondary-c: #3A3F52; --on-secondary-c: #DCE2F5;
  --outline: #8E9099; --outline-2: #3A3A44;
  --ok: #6DD58C; --ok-c: #0F3D20; --warn: #F0B548; --warn-c: #4A3000; --danger: #F2B8B5; --danger-c: #5C1A14; --rec: #FF6B5E;
  --mark: #4D4218; --mic: #A8C7FA; --sys: #6DD58C;
  --hud: #2A2A31; --hud-2: #35353D;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 4px 16px rgba(0,0,0,.45); --shadow-3: 0 16px 48px rgba(0,0,0,.6);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121216; --surface: #1C1C21; --surface-2: #26262C; --surface-3: #30303A; --surface-4: #3B3B46;
  --text: #E5E2EC; --text-2: #C5C4CF; --text-3: #8F8F9A;
  --primary: #A8C7FA; --on-primary: #062E6F; --primary-c: #0842A0; --on-primary-c: #D3E3FD;
  --secondary-c: #3A3F52; --on-secondary-c: #DCE2F5;
  --outline: #8E9099; --outline-2: #3A3A44;
  --ok: #6DD58C; --ok-c: #0F3D20; --warn: #F0B548; --warn-c: #4A3000; --danger: #F2B8B5; --danger-c: #5C1A14; --rec: #FF6B5E;
  --mark: #4D4218; --mic: #A8C7FA; --sys: #6DD58C;
  --hud: #2A2A31; --hud-2: #35353D;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 4px 16px rgba(0,0,0,.45); --shadow-3: 0 16px 48px rgba(0,0,0,.6);
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 400 14px/20px var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, h4, p { margin: 0; }
svg { flex: none; }
::placeholder { color: var(--text-3); }
.hidden { display: none !important; }
.mono { font-family: var(--mono); font-size: 12px; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); }
.num { font-variant-numeric: tabular-nums; }
.grow { flex: 1 1 0; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--surface-4) transparent; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100vh; }
.rail { display: flex; flex-direction: column; align-items: center; padding: 14px 0 12px; gap: 4px; }
.rail .logo { width: 40px; height: 40px; border-radius: 14px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; margin-bottom: 10px; }
.rail .rec-fab { width: 56px; height: 56px; border-radius: 18px; background: var(--primary-c); color: var(--on-primary-c); display: grid; place-items: center; margin-bottom: 14px; box-shadow: var(--shadow-1); transition: transform .15s; }
.rail .rec-fab:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
.rail .rec-fab .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 0 3px rgba(217,48,37,.2); }
.nav-item { width: 76px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: var(--text-2); font-size: 12px; font-weight: 500; letter-spacing: .01em; position: relative; }
.nav-item .pill { width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background .15s, color .15s; }
.nav-item:hover .pill { background: var(--surface-2); }
.nav-item.active .pill { background: var(--secondary-c); color: var(--on-secondary-c); }
.nav-item.active { color: var(--text); }
.nav-item .badge { position: absolute; top: 4px; right: 14px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; line-height: 16px; padding: 0 5px; font-weight: 600; }
.nav-item .dotb { position: absolute; top: 8px; right: 20px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.rail .spacer { flex: 1; }
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 14px 20px 20px 0; }
.topbar { display: flex; align-items: center; gap: 10px; height: 40px; margin-bottom: 8px; }
.project-chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-1); font-weight: 600; }
.project-chip .av { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #7C4DFF, #0B57D0); }
.status-chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-1); color: var(--text-2); font-weight: 500; }
.status-chip .ring { width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(var(--primary) calc(var(--p) * 1%), var(--surface-3) 0); position: relative; }
.status-chip .ring::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--surface); }
.icon-btn { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; color: var(--text-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 14px; }
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.page-head { display: flex; align-items: flex-end; gap: 16px; padding: 8px 4px 18px; }
.page-head h1 { font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -.02em; }
.page-head .sub { color: var(--text-2); margin-top: 2px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.body { flex: 1; min-height: 0; }

/* ---------- Components ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; border-radius: 20px; font-weight: 600; font-size: 14px; background: var(--surface-2); color: var(--text); transition: background .15s, transform .1s, box-shadow .15s; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.98); }
.btn.filled { background: var(--primary); color: var(--on-primary); }
.btn.filled:hover { box-shadow: var(--shadow-2); }
.btn.tonal { background: var(--primary-c); color: var(--on-primary-c); }
.btn.outlined { background: transparent; box-shadow: inset 0 0 0 1px var(--outline); }
.btn.outlined:hover { background: var(--surface-2); }
.btn.text { background: transparent; color: var(--primary); padding: 0 12px; }
.btn.text:hover { background: var(--surface-2); }
.btn.rec { background: var(--rec); color: #fff; }
.btn.sm { height: 32px; padding: 0 14px; font-size: 13px; }
.btn.lg { height: 48px; padding: 0 28px; font-size: 15px; border-radius: 24px; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--outline); font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; cursor: pointer; }
.chip.on { background: var(--secondary-c); color: var(--on-secondary-c); box-shadow: none; }
.chip.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--text-2); }
.tag.ok { background: var(--ok-c); color: var(--ok); } .tag.warn { background: var(--warn-c); color: var(--warn); } .tag.danger { background: var(--danger-c); color: var(--danger); } .tag.prim { background: var(--primary-c); color: var(--on-primary-c); }
.card { background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow-1); }
.card.flat { box-shadow: none; }
.search { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--surface-2); color: var(--text-2); min-width: 240px; }
.search input { flex: 1; border: 0; background: none; outline: none; color: var(--text); }
.search.sm { height: 36px; border-radius: 18px; min-width: 180px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 20px; padding: 3px; gap: 2px; }
.seg button { height: 32px; padding: 0 14px; border-radius: 17px; font-weight: 500; color: var(--text-2); font-size: 13px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--outline-2); padding: 0 8px; }
.tabs button { height: 44px; padding: 0 14px; font-weight: 500; color: var(--text-2); position: relative; font-size: 14px; }
.tabs button.on { color: var(--primary); }
.tabs button.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); }
.switch { width: 44px; height: 24px; border-radius: 12px; background: var(--surface-4); position: relative; transition: background .15s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: var(--shadow-1); }
.switch.on { background: var(--primary); }
.switch.on::after { transform: translateX(20px); }
.cb { width: 18px; height: 18px; border-radius: 5px; box-shadow: inset 0 0 0 2px var(--outline); display: grid; place-items: center; flex: none; color: #fff; }
.cb.on { background: var(--primary); box-shadow: none; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 500; color: var(--text-2); }
.input { height: 44px; border-radius: 12px; background: var(--surface-2); border: 0; padding: 0 14px; outline: none; width: 100%; }
.input:focus { box-shadow: 0 0 0 2px var(--primary); }
.kbd { font: 500 11px/16px var(--mono); padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--text-2); }
.spk { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; }
.spk i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.spk.mic { color: var(--mic); } .spk.sys { color: var(--sys); }
.empty { text-align: center; padding: 48px 24px; color: var(--text-2); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--surface-4); border-top-color: var(--primary); animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(217,48,37,.35);} 50% { box-shadow: 0 0 0 10px rgba(217,48,37,0);} }
.type { font: 600 11px/16px var(--mono); padding: 1px 6px; border-radius: 5px; background: var(--surface-2); }
.type.fr { color: #0B57D0; } .type.br { color: #5B45C9; } .type.nfr { color: #0A6D66; } .type.q { color: #9A3A9E; } .type.rsk { color: #B0471B; }

/* ---------- Meetings ---------- */
.meetings { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 34%); gap: 16px; height: 100%; }
.pipe { display: flex; gap: 8px; padding: 0 4px 14px; flex-wrap: wrap; }
.pipe .step { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-1); font-weight: 500; }
.pipe .step .ring { width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(var(--c, var(--primary)) calc(var(--p) * 1%), var(--surface-3) 0); position: relative; }
.pipe .step .ring::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); }
.pipe .step .ring.done { background: var(--ok); } .pipe .step .ring.done::after { inset: 0; background: none; content: "✓"; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.pipe .step small { color: var(--text-3); font-weight: 400; }
.list-card { display: flex; flex-direction: column; min-height: 0; }
.list-tools { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
.mrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border-radius: 16px; margin: 0 8px; cursor: pointer; transition: background .12s; }
.mrow:hover { background: var(--surface-2); }
.mrow.on { background: var(--secondary-c); }
.mrow .ic { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); }
.mrow.on .ic { background: var(--surface); }
.mrow h3 { font-size: 15px; font-weight: 600; line-height: 20px; }
.mrow .meta { color: var(--text-3); font-size: 13px; margin-top: 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mrow .right { text-align: right; color: var(--text-3); font-size: 13px; display: grid; gap: 4px; justify-items: end; }
.panel { display: flex; flex-direction: column; min-height: 0; }
.panel-head { padding: 18px 20px 8px; }
.panel-head h2 { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -.01em; outline: none; border-radius: 6px; }
.panel-head h2:focus { box-shadow: 0 0 0 2px var(--primary); padding: 0 4px; }
.panel-head .meta { color: var(--text-3); font-size: 13px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.panel-body { flex: 1; min-height: 0; padding: 16px 20px; }
.panel-foot { display: flex; gap: 8px; padding: 12px 20px 16px; flex-wrap: wrap; }
.summary h4 { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
.summary ul { margin: 0; padding-left: 18px; } .summary li { margin: 4px 0; line-height: 20px; }
.summary .ts { color: var(--primary); font-family: var(--mono); font-size: 12px; cursor: pointer; }
.line { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px 0; line-height: 22px; }
.line .t { color: var(--text-3); font-family: var(--mono); font-size: 12px; padding-top: 3px; }
.line .q { background: var(--mark); border-radius: 3px; padding: 0 2px; }
.line .atoms { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.line .atom { display: inline-flex; gap: 6px; align-items: center; height: 24px; padding: 0 8px 0 4px; border-radius: 6px; background: var(--surface-2); font-size: 12px; color: var(--text-2); max-width: 100%; }
.line.hit .q2 { background: var(--primary-c); color: var(--on-primary-c); border-radius: 3px; }
.req { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--outline-2); align-items: start; }
.req .st { font-size: 14px; line-height: 20px; } .req .qt { color: var(--text-3); font-size: 12px; margin-top: 3px; }
.notes-view { white-space: pre-wrap; line-height: 22px; }

/* ---------- Session ---------- */
.session { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 14px; height: 100%; }
.sess-head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
.sess-head .title { font-size: 20px; font-weight: 600; letter-spacing: -.01em; outline: none; border-radius: 6px; padding: 2px 6px; }
.sess-head .title:focus { box-shadow: 0 0 0 2px var(--primary); }
.sess-head .timer { font: 600 18px/1 var(--mono); color: var(--text-2); letter-spacing: .02em; }
.audio-pill { display: inline-flex; align-items: center; gap: 4px; height: 48px; padding: 0 6px 0 16px; border-radius: 24px; background: var(--hud); color: var(--hud-text); }
.audio-pill .live { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); margin-right: 8px; animation: pulse 1.6s infinite; }
.audio-pill.paused .live { animation: none; background: var(--warn); }
.audio-pill button { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; color: var(--hud-text); }
.audio-pill button:hover { background: var(--hud-2); }
.audio-pill .stop { background: var(--rec); color: #fff; } .audio-pill .stop:hover { background: #c22a1f; }
.levels { display: flex; gap: 3px; align-items: center; height: 24px; }
.levels i { width: 3px; border-radius: 2px; background: var(--primary); animation: lv 1s ease-in-out infinite; }
.levels i:nth-child(2) { animation-delay: .15s; } .levels i:nth-child(3) { animation-delay: .3s; } .levels i:nth-child(4) { animation-delay: .45s; } .levels i:nth-child(5) { animation-delay: .6s; }
@keyframes lv { 0%,100% { height: 6px; } 50% { height: 22px; } }
.sess-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, 1fr); gap: 14px; min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; }
.col-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--outline-2); }
.col-head h2 { font-size: 15px; font-weight: 600; }
.col-body { flex: 1; min-height: 0; padding: 8px 16px; }
.listening { display: flex; gap: 10px; align-items: center; color: var(--text-3); padding: 10px 0; font-style: italic; }
.notes-editor { flex: 1; min-height: 0; width: 100%; border: 0; background: none; resize: none; outline: none; line-height: 22px; padding: 12px 16px; font-family: var(--font); }
.fmt { display: flex; gap: 2px; padding: 6px 10px; border-bottom: 1px solid var(--outline-2); }
.fmt button { width: 30px; height: 30px; border-radius: 8px; color: var(--text-2); font-weight: 600; font-size: 13px; }
.fmt button:hover { background: var(--surface-2); }
.live-req { border-top: 1px solid var(--outline-2); }
.live-req .req { border: 0; padding: 8px 16px; }
.live-req .req:hover { background: var(--surface-2); }
.q-card { position: absolute; left: 24px; bottom: 24px; width: 380px; background: var(--hud); color: var(--hud-text); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow-3); animation: fade .25s; }
.q-card h4 { font-size: 14px; display: flex; gap: 8px; align-items: center; }
.q-card p { color: var(--hud-text-2); margin: 8px 0 12px; line-height: 20px; }
.q-card .row { display: flex; gap: 8px; }
.q-card .btn { background: var(--hud-2); color: var(--hud-text); height: 34px; }
.q-card .btn.filled { background: var(--primary-c); color: var(--on-primary-c); }

/* ---------- Library ---------- */
.library { display: grid; grid-template-columns: 224px minmax(0, 1fr) minmax(300px, 26%); gap: 14px; height: 100%; }
.tree { padding: 10px 8px; }
.tree .node { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 12px; color: var(--text-2); font-weight: 500; cursor: pointer; }
.tree .node:hover { background: var(--surface-2); } .tree .node.on { background: var(--secondary-c); color: var(--on-secondary-c); }
.tree .node .n { margin-left: auto; color: var(--text-3); font-size: 12px; font-weight: 400; }
.tree .node.sub { padding-left: 30px; height: 32px; font-weight: 400; font-size: 13px; }

.ftable td:first-child { border-radius: 10px 0 0 10px; } .ftable td:last-child { border-radius: 0 10px 10px 0; }
.fname { display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--text); }
.fico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 700 9px/1 var(--mono); color: #fff; }

.link:hover { background: var(--surface-2); }
.link .wl { color: var(--primary); font-weight: 500; }


/* ---------- Whisper ---------- */
.whisper { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 38%); gap: 16px; height: 100%; }

.wbtn.live { background: var(--rec); color: #fff; animation: wpulse 1.4s infinite; }
@keyframes wpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(217,48,37,.35), var(--shadow-2);} 50% { box-shadow: 0 0 0 22px rgba(217,48,37,0), var(--shadow-2);} }
.wcap h2 { font-size: 22px; font-weight: 600; letter-spacing: -.015em; margin-top: 24px; }
.wcap .hint { color: var(--text-3); margin-top: 6px; font-size: 13px; }
.wlive { margin-top: 24px; max-width: 560px; font-size: 18px; line-height: 28px; color: var(--text); min-height: 56px; }

@keyframes blink { 50% { opacity: 0; } }
.wres { width: min(620px, 100%); text-align: left; margin-top: 8px; display: grid; gap: 12px; animation: fade .25s; }

.wparsed { border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--primary-c); padding: 16px 18px; display: grid; gap: 10px; }
.wparsed .types { display: flex; gap: 6px; flex-wrap: wrap; }
.wparsed .title { font-size: 17px; font-weight: 600; outline: none; border-radius: 6px; }
.wparsed .title:focus { box-shadow: 0 0 0 2px var(--primary); padding: 0 4px; }
.wparsed .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--text-2); font-size: 13px; }

.wkind { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.wkind.task { background: var(--primary-c); color: var(--on-primary-c); } .wkind.note { background: var(--warn-c); color: var(--warn); } .wkind.remind { background: var(--danger-c); color: var(--danger); } .wkind.idea { background: var(--ok-c); color: var(--ok); }
.winbox { display: flex; flex-direction: column; min-height: 0; }
.wsec { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); padding: 14px 16px 6px; }
.witem { display: grid; grid-template-columns: auto 36px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 16px; margin: 0 8px; border-radius: 14px; cursor: pointer; }

.witem .tx { line-height: 20px; } .witem.done .tx { color: var(--text-3); text-decoration: line-through; }
.witem .m { color: var(--text-3); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.witem .m .due { color: var(--danger); font-weight: 500; } .witem .m .due.ok { color: var(--ok); }

/* ---------- Generic tables (requirements, backlog) ---------- */

.rtable td { padding: 12px 14px; border-bottom: 1px solid var(--outline-2); vertical-align: top; }
.rtable tr:hover td { background: var(--surface-2); }

/* ---------- Settings ---------- */

.disc:first-child { border-top: 0; }
.disc .l { flex: 1; } .disc .l b { display: block; font-weight: 500; } .disc .l small { color: var(--text-3); }

/* ---------- Tutorial spotlight ---------- */
.tut { position: fixed; inset: 0; z-index: 30; }

.tut .tip .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.tut .tip .row .n { color: var(--text-3); font-size: 12px; }
.tut .tip .row .right { margin-left: auto; display: flex; gap: 6px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--hud); color: var(--hud-text); border-radius: 14px; padding: 12px 18px; box-shadow: var(--shadow-3); font-size: 13px; z-index: 40; animation: fade .2s; display: flex; gap: 14px; align-items: center; }

}

const TUT = [["t-rec", "Записать встречу", "Одна кнопка: микрофон и системный звук пишутся раздельно, транскрипт и требования появляются по ходу встречи."], ["t-whisper", "Шепнуть", "Скажите задачу, заметку или напоминание — они лягут в личный ящик и не смешаются с требованиями. ⌥ Пробел из любого окна."], ["t-list", "Встречи", "Все записи, импорты и тексты проекта. Переименуйте прямо в списке, ищите по словам из разговора."], ["t-library", "Материалы", "Папка проекта на диске. Добавляйте документы и ссылки — ИИ будет их цитировать."], ["t-ask", "Спросить", "Вопрос по всему проекту: ответ с цитатами из встреч и файлов, всё считается локально."]];
function tutorial() {
  const [id, t, d] = TUT[S.tut - 1];
  const el = document.getElementById(id);
  const r = el ? el.getBoundingClientRect() : { left: 20, top: 20, width: 60, height: 60, right: 80, bottom: 80 };
  const pad = 8, left = r.right + 20 + 320 < innerWidth ? r.right + 20 : Math.max(16, r.left - 340), top = Math.min(innerHeight - 200, Math.max(16, r.top));
  return html`<div class="tut"><div class="spot" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px"></div>
    <div class="tip" style="left:${left}px;top:${top}px"><h4>${t}</h4><p>${d}</p><div class="row"><span class="n">${S.tut} из ${TUT.length}</span><div class="right"><button class="btn sm text" onclick="S.tut=0;render()">Закрыть</button><button class="btn sm filled" onclick="S.tut=${S.tut < TUT.length ? S.tut + 1 : 0};render()">${S.tut < TUT.length ? "Дальше" : "Готово"}</button></div></div></div></div>`;
}

  const app = $("#app");
  if (S.onb) { app.innerHTML = onboarding(); return; }
  app.innerHTML = shell(PAGES[S.page]()) + (S.toast ? `<div class="toast">${S.toast}</div>` : "");
  if (S.tut) app.insertAdjacentHTML("beforeend", tutorial());
}
addEventListener("hashchange", () => { if (location.hash === "#onboarding") S.onb = 1; render(); });
addEventListener("resize", () => { if (S.tut) render(); });
addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key >= "1" && e.key <= "9") { e.preventDefault(); go(["meetings", "library", "requirements", "documents", "backlog", "ask", "settings", "session", "whisper"][+e.key - 1]); }
  if (e.altKey && e.code === "Space") { e.preventDefault(); go("whisper"); setTimeout(() => wStart(), 50); }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "l") { e.preventDefault(); S.theme = S.theme === "dark" ? "light" : "dark"; localStorage.setItem("wb5.theme", S.theme); theme(); }
  if (e.key === "Escape" && S.tut) { S.tut = 0; render(); }
});
setInterval(() => { if (S.page === "session" && !S.paused && !S.onb) { S.secs++; const t = document.querySelector(".timer"); if (t) t.textContent = fmtSecs(S.secs); } }, 1000);
if (location.hash === "#onboarding") S.onb = 1;
render();
</script>
