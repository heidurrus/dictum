name: build installers

# Every push and pull request runs the gates (pytest, the i18n and tokens checks, svelte-check). On master and on
# tags the installers are built with a bundled Python (packaging/build.py) after the gates pass:
#   Dictum-<version>-macos-arm64.dmg and Dictum-<version>-windows-x64.exe.
# Pushing a tag like v5.0.0 also publishes both as a GitHub release. No secrets are required: without
# MACOS_SIGN_IDENTITY the macOS bundle is signed ad hoc.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-14   # Apple Silicon, like the dev machines; torch is stubbed by tests/conftest.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: i18n check (ru and en in step)
        working-directory: frontend
        run: npm run i18n
      - name: Tokens check
        working-directory: frontend
        run: npm run tokens
      - name: svelte-check
        working-directory: frontend
        run: ./node_modules/.bin/svelte-check --threshold warning

  macos:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build .app and .dmg
        env:
          # Set this repository secret to sign with a Developer ID; otherwise ad-hoc.
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: python packaging/build.py --target macos-arm64
      - name: Self-test the bundle
        run: |
          MNT=$(hdiutil attach -nobrowse -readonly dist/Dictum-*-macos-arm64.dmg | tail -1 | cut -f3)
          "$MNT/Dictum.app/Contents/MacOS/Dictum" --self-test
          hdiutil detach "$MNT"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/Dictum-*-macos-arm64.dmg

  windows:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: python packaging/build.py --target windows-x64
      - name: Self-test the bundled runtime
        run: build\windows\stage\python\python.exe build\windows\stage\app\boot.py --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Dictum-*-windows-x64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Dictum-*-macos-arm64.dmg
            dist/Dictum-*-windows-x64.exe
          generate_release_notes: true
